<head>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: #00ff41;
            font-family: "Courier New", monospace;
            height: 100vh;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,255,65,0.03),
                rgba(0,255,65,0.03) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
        }

        .terminal {
            padding: 30px;
            height: 100vh;
            overflow: hidden;
            text-shadow: 0 0 8px #00ff41;
        }

        .line {
            margin: 7px 0;
            font-size: 16px;
        }

        .big {
            font-size: 32px;
            margin-top: 30px;
            animation: glow 1s infinite alternate;
        }

        .red {
            color: #ff1744;
            text-shadow: 0 0 8px #ff1744;
        }

        .blink {
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        @keyframes glow {
            from { text-shadow: 0 0 5px #00ff41; }
            to { text-shadow: 0 0 25px #00ff41; }
        }
    </style>
</head>

<body>

<div class="terminal" id="terminal"></div>

<script>
    const terminal = document.getElementById("terminal");

    const lines = [
        "[+] Initializing secure connection...",
        "[+] Connecting to remote server...",
        "[+] Connection established.",
        "[+] Searching network interface...",
        "[+] Detecting public IP...",
        "[+] IP address detected: 192.0.2.123",

        "",
        "Uploading information...",
        "████████████████████████████ 100%"
    ];

    let index = 0;

    function addLine() {
        if (index < lines.length) {
            const div = document.createElement("div");
            div.className = "line";
            div.textContent = lines[index];
            terminal.appendChild(div);

            index++;
            window.scrollTo(0, document.body.scrollHeight);

            setTimeout(addLine, Math.random() * 500 + 250);

            setTimeout(showTroll, 1000);
        }
    }

    function showTroll() {
        terminal.innerHTML = `

        `;
    }

    addLine();
</script>
